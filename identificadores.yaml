# Identificadores: carrito/cesto/bolso/mochila en el frame completo.
# botella y celular no van a frame completo: solo el recorte de muñeca.
# Canonical file: identifiers.yaml. This copy keeps older --identificadores paths working.
#
# destination / accessory / body: same meaning as identifiers.yaml.
# A pocket (body: true) is only a deposit with a hand-into-pocket gesture.
# Back-turned + pocket gesture still counts. A waist bag is a destination if
# the object reaches it; a shoulder bag is not a fallback deposit.

# hands.min_confidence applies per hand. MediaPipe rejects empty-hand masks.
hands:
  min_confidence: 0.50
  # Palma/dedos de MediaPipe (no la muñeca). Palma abierta que cuelga: no SAM.
  # Puño cerrado o alcance a la estantería: sí se busca (artículo genérico).
  min_hand_confidence: 0.30

identifiers:
  carrito:
    active: true
    destination: true
    accessory: false
    prompts:
      - shopping cart
      - shopping trolley
      - metal cart
      - supermarket cart
      - wire cart

  cesto:
    active: true
    destination: true
    accessory: false
    prompts:
      - shopping basket
      - basket

  bolso:
    active: true
    ultralytics_id: 26
    name: handbag
    destination: true
    accessory: true
    prompts:
      - handbag
      - purse

  mochila:
    active: true
    ultralytics_id: 24
    name: backpack
    destination: true
    accessory: true
    prompts:
      - backpack

  bolsa:
    active: true
    destination: true
    accessory: false
    prompts:
      - plastic bag
      - shopping bag
      - paper bag

  celular:
    active: true
    ultralytics_id: 67
    name: cell phone
    destination: false
    accessory: false
    prompts:
      - cell phone
      - mobile phone

  botella:
    active: true
    ultralytics_id: 39
    name: bottle
    destination: false
    accessory: false
    prompts:
      - bottle
      - beer bottle
      - plastic bottle

  bolsillo:
    active: true
    destination: true
    accessory: false
    body: true
    prompts: []
